<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>India COVID‑19 State Tracker</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="container">
    <h1>India COVID‑19 State Tracker</h1>
    <input id="stateInput" type="text" placeholder="Enter state name (e.g., Maharashtra)" />
    <button id="searchBtn">Search</button>
    <div id="stats">
      <p class="welcome-message">Enter a state name above to view COVID-19 statistics.<br>
      Example: Maharashtra, Delhi, Karnataka</p>
    </div>
  </div>
  <script src="scrpit.js"></script>
</body>
</html>
